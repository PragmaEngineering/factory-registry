<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1740" viewBox="0 0 1800 1740" role="img" aria-labelledby="title description">
<title id="title">Go coding factory: admission, design, implementation, and human acceptance</title>
<desc id="description">The task-readiness classifier admits an accepted task at probability 0.85 or higher; other valid assessments require a human admission override. Design runs architect and architecture reviewer sequentially for up to three rounds per visit, followed by human design approval. Implementation runs Go coder and code reviewer sequentially for up to three rounds per visit, followed by human acceptance. Human change requests start another bounded visit. Rejection or execution failure blocks the run. Execution hooks prepare an execution worktree and retain its checkout after success; stage after hooks create commits after design approval and final acceptance.</desc>
<defs>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.7" fill="#d5dde8" opacity="0.55"/></pattern>
  <linearGradient id="paper" x2="0" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#edf3f7"/></linearGradient>
  <linearGradient id="agentfill" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#f2faf9"/></linearGradient>
  <filter id="shadow" x="-15%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#193047" flood-opacity="0.07"/></filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#657b90" stroke-width="1.5"/></marker>
  <marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#087e83" stroke-width="1.5"/></marker>
  <marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#a65b63" stroke-width="1.5"/></marker>
</defs>
